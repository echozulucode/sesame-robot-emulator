  - id: ISSUE-20260823-022
    title: "QEMU boot is intermittently flaky: ~20% of runs panic with a cache error and emit zero telemetry"
    category: bug
    severity: medium
    priority: p2
    confidence: high
    scope: emulator
    observed: |
      run-bridge-demo.mjs intermittently fails during early boot with:
        Guru Meditation Error: Core 0 panic'ed (Cache error).
        Cache disabled but cached memory region accessed
      The run completes but emits 0 servo.target events instead of the expected 29.
      Measured 2026-08-23: 1 failure in 5 consecutive runs of the same unmodified image.
      Failures and successes both leave the flash image byte-identical (sha256 unchanged),
      so it is not image mutation from the missing snapshot=on.
    expected: |
      Deterministic boot. Q1 reported "exactly 29 servo events per run across 3 runs, zero
      panics" - true as far as it went, but a 3-run sample under-measured a roughly 1-in-5
      failure rate.
    trace_link: "emulator/qemu/run-bridge-demo.mjs; emulator/qemu/logs/bridge-demo.qemu.log; docs/findings/Q1-qemu-spike.md"
    status: open
    next_action: |
      Nothing further is available from this side. A real fix means correcting QEMU's ESP32
      cache/DPORT model so that spi_flash_disable_interrupts_caches_and_other_cpu and its
      inverse are tracked per core - upstream work on espressif/qemu. If that lands, drop the
      retry loop in packages/sesame-qemu/src/session.ts and re-run
      `node emulator/qemu/measure-connect.mjs --runs 25 --attempts 1`, which is the
      retry-disabled measurement.
    resolution: |
      Q2 characterised it properly and could not fix it; connect() now retries past it.
      Measured, not estimated (docs/findings/Q2-qemu-backend.md section 1):

      ROOT CAUSE. Panic backtraces resolved with xtensa-esp32-elf-addr2line put core 0 in
      cache_ll_l1_enable_bus <- cache_hal_resume <- spi_flash_restore_cache <-
      spi_flash_enable_interrupts_caches_and_other_cpu <- esp_flash_read <-
      nvs::Page::load <- nvs_flash_init <- initArduino, with core 1 parked in
      spi_flash_op_block_func on the IPC task. That is the standard ESP-IDF dual-core
      protocol for touching flash; QEMU does not model the per-core cache enable/disable
      state through it. A second signature (both cores faulting in the FreeRTOS idle task)
      and a third (core 1 in mask ROM at call_start_cpu1) are the same fault seen later or
      earlier.

      BEFORE: 8/20 cache errors on Q1's exact configuration; 30/107 (28%) pooled over every
      configuration measured. The original "1 in 5" undercounted because 2 of 8 failures
      self-recover via SW_CPU_RESET and were being scored as passes. The rate is also bursty:
      the retry-disabled control arm gave 2 failures in 4 on one sitting and 0 in 10 twenty
      minutes later, so an i.i.d. model of it is optimistic.

      RULED OUT, each measured: snapshot=on (6/20 vs 8/20 - no effect on the rate, but added
      anyway, since without it the guest's NVS and coredump writes mutate the image file);
      the UART-attach race (the backtraces contain no UART code, and the client now
      poll-connects at ~66 ms instead of sleeping 1500 ms, which is a detection improvement
      not a fix); host CPU parallelism (pinned to one core it still panics, with a new
      signature). Two QEMU knobs that would serialise the cores make the machine stop booting
      entirely: -accel tcg,thread=single (20/20 runs, zero UART output) and -icount shift=0
      (no ROM banner at all). -smp 1 likewise.

      AFTER: QemuSesameRobot.connect() verifies boot against the firmware's own end-of-setup()
      banner, fails an attempt on any panic pattern including a guest SW_CPU_RESET, and
      relaunches. 25 connects: 0 failures, 37 boot attempts of which 12 failed (32.4% per
      boot, unchanged), attempts-per-connect 1x19 2x4 3x1 7x1, 0 orphaned qemu processes.
      The 7-attempt outlier is why the default budget is 12 rather than 8, and is weak
      evidence that failures cluster rather than being independent.

      This is a MITIGATION, not a fix. The QEMU bug is untouched and anything that boots QEMU
      without this retry will still see roughly one failure in three.
    lesson: LESSON-20260823-011
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Found during pre-evaluation verification, not by the agent that wrote the script. First attributed to a bogus --help argument; that was wrong - the QEMU args are fully hardcoded with no argv passthrough. A controlled 5-run test showed 1 bare failure, 2 bare successes, and a success WITH --help, isolating the cause to run-to-run nondeterminism."
      - timestamp: 2026-08-23T00:00:00Z
        note: "Q2: root-caused to QEMU's ESP32 cache/DPORT model, not to anything in this repo. The measurement lesson repeats the one this issue already taught: the reported 1-in-5 was itself an under-measurement, because a panic that reboots and then works looks like a pass unless you check for the panic. 20+ runs per configuration, and a success criterion that names the failure signature rather than only its symptom."

  - id: ISSUE-20260823-023
    title: "3D world appears to jump during motion: the ground plane slides instead of the robot"
    category: bug
    severity: medium
    priority: p1
    confidence: high
    scope: apps/web
    observed: |
      User-reported during evaluation: "for some of the motions, the 3d world seems to jump
      around which seems like the world coordinates are moving or the camera is trying to keep
      the robot centered."
      Diagnosed: apps/web/src/three/RobotScene.tsx GroundPlane repositions itself EVERY FRAME to
      computeGroundPlaneMm(rig). V2 flagged that value as pose-dependent (-68.650 mm at stand,
      -31.115 mm at rest), so as the legs move the floor and grid slide vertically under a robot
      whose root stays pinned at the world origin. The grid is the only visual reference, so the
      whole world reads as jumping. The camera and OrbitControls are NOT at fault - the target is
      static at (0, -0.012, -0.008).
    expected: |
      The floor stays put and the robot moves relative to it, as a real robot on a real desk
      does - feet planted, body rising and falling.
    trace_link: "apps/web/src/three/RobotScene.tsx (GroundPlane, WorldFrameReading); apps/web/src/three/rig.ts (groundReferenceMm); scripts/capture-web-screenshots.mjs phase 1; docs/findings/V3-V4-browser-robot.md section 12"
    status: resolved
    next_action: "None - resolved; see resolution."
    resolution: |
      Confirmed the diagnosis in a real browser before changing anything: across nine
      worldFrame() samples through runWavePose, the OrbitControls target and the GLB root drift
      0.000e+0 mm while the grid drifts 37.535 mm. The camera was never involved.
      Fix: the floor is pinned and the robot does not move. GroundPlane no longer has a useFrame
      at all; its height comes from the new rig.ts groundReferenceMm(facts), which returns the
      asset's own groundPlane.atRunStandPoseMm (-68.650046 mm) - still read from the GLB, never
      typed in. The live pose-dependent value is still computed and still shown in the asset
      panel, where a changing number is information rather than a wobble.
      The robot root is deliberately NOT translated to settle onto the floor, against the
      next_action originally logged, for three measured reasons. (1) World space IS V2's
      canonical frame: pivotWorldMm, computeGroundPlaneMm and verifyStandPose all report
      canonical coordinates straight off matrixWorld, so translating the root would silently
      redefine every world-space number this app publishes, including the -68.650046 mm the
      harness checks against V2. (2) The commanded stream is a step function, so any settle rule
      reproduces exactly the 37.5 mm jump the user complained about, merely reattributed from the
      floor to the robot. (3) In runShrugPose and runDeadPose all four feet leave the ground at
      once and the real contact set is the chassis; a feet-only solver buries or floats the body
      by ~36 mm, and resolving that is physics, which Gate E excludes.
      A fixed plane is not a compromise here, it is exact: the hips are yaw joints (sweeping any
      hip over 0-180 deg changes no foot's height at all, asserted in rig.test.ts), so foot height
      is a function of the knees alone, and the deepest any knee can reach is -68.9233 mm against
      a floor at -68.6500 mm. Worst case 0.27 mm of interpenetration on a 130 mm robot, at a
      hand-dialled angle no movement uses; at every pose in the choreography the feet are flush.
      Regression test: window.__sesame.worldFrame() reads the grid, the GLB root, the orbit target
      and the camera off matrixWorld, and capture-web-screenshots.mjs phase 1 samples it nine
      times from BEFORE anything is commanded through runWavePose, requiring every field to hold
      to 1e-6 mm while the pose-dependent foot contact sweeps 37.535 mm - the last clause is what
      stops the check being vacuous. Confirmed FAILING on the unfixed code ("the ground plane /
      grid moved 37.535 mm ...") and passing after. Evidence in
      docs/findings/assets/issue-023-world-frame.json and the six issue-023-ground-{before,after}
      screenshots.
      Also audited: GroundPlane was the only place in apps/web where a pose-dependent value
      reached a world-space transform. Nothing else writes .position, .scale or a camera target
      after construction.
    lesson: null
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Reported by the user on first visual evaluation. Not caught by the headless capture harness, which asserts joint rotations and pixel counts but nothing about world-space stability between frames."
      - timestamp: 2026-08-23T00:00:00Z
        note: "Resolved. Floor pinned at the asset's reference-pose ground plane; robot root left at the canonical origin rather than settled, because world space is the canonical frame and because contact with four feet lifted is a physics question. Harness extended with a world-frame stability check, confirmed red before the fix and green after; rig.test.ts now asserts the two geometric facts (hips are yaw, no knee reaches more than 0.27 mm below the plane) that make one fixed plane exact rather than approximate."

