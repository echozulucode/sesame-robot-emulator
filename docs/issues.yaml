    category: research-blocker
    severity: high
    priority: p2
    confidence: high
    scope: emulator
    observed: |
      Both the real Sesame ELF and a minimal three-line Arduino sketch abort on instruction #0.
      "Illegal entry instruction (pc = 40025504)" - `entry a1,48` at call_start_cpu0. Reset state
      is PS 0x1F (WOE=0, EXCM=1), WINDOWSTART 0, SP 0; with no boot ROM nothing initialises them.
      setup() is 34 ESP-IDF startup functions away.
