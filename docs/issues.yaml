  - id: ISSUE-20260823-004
    title: "UPSTREAM: epd_bitmap_stand and epd_bitmap_defualt declared weak, never defined"
    category: bug
    severity: high
    priority: p2
    confidence: high
    scope: upstream
    observed: |
      Both symbols are declared __attribute__((weak)) and never defined - confirmed ABSENT from
      the ELF symbol table with zero compiler diagnostics (the platform builds with -w). The
      startup `default` face is therefore a null pointer, and `stand`, `default` and every
      unknown face name render 0 frames. The global fallback is itself empty. /api/status will
      report a face that is not on screen.
    expected: "Named faces render their bitmaps, or the build fails loudly."
    trace_link: "docs/findings/F4-doc-drift.md; docs/findings/F3-firmware-build.md (binary-level confirmation)"
    status: open
    next_action: |
      File upstream at github.com/dorianborian/sesame-robot. We deliberately did NOT patch it -
      Phase 0 rule was to keep upstream pristine. Our replay fixture models the bug faithfully.
    resolution: null
    lesson: null
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Found by F4 in source; independently confirmed by F3 at the ELF symbol-table level; encoded as executable behaviour in R7's replay fixture."

