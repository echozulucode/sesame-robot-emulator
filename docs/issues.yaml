  - id: ISSUE-20260823-012
    title: "Build reproducibility is same-machine only"
    category: correctness
    severity: low
    priority: p3
    confidence: high
    scope: firmware
    observed: |
      All firmware profiles are bit-for-bit reproducible across clean rebuilds on this host, but
