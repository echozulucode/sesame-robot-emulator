  - id: ISSUE-20260823-003
    title: "tlib ESP32-S2/S3 core configs include the LX6 opcode table, so salt/saltu are unrecognized"
    category: bug
    severity: medium
    priority: p3
    confidence: high
    scope: emulator-upstream
    observed: |
      `salt` / `saltu` -> "unrecognized opcode in slot 0" on esp32/esp32s2/esp32s3 core configs.
      196 uses in the real Sesame ELF including heap_caps_check_add_region_allowed and
      xTaskIncrementTick. Root cause found in source: tlib/arch/xtensa/core-esp32s2.c and
      core-esp32s3.c literally #include "core-esp32/xtensa-modules.c.inc" - the LX6 table on LX7
      cores. translate_salt already exists at translate.c:2053.
    expected: |
      LX7 cores use an LX7 opcode table. Espressif's QEMU fork ships a generated one.
    trace_link: "docs/findings/R2-xtensa-execution-probe.md; docs/findings/R4-boot-probe.md"
    status: open
    next_action: |
      Low priority. R4's de233_fpu diagnostic showed the boot wedges in the identical SPI-flash
      spin with salt available, so the missing opcodes are NOT the binding constraint. Fixing
      them alone buys nothing. ~1 d file drop + 1-2 d one-off tlib build bring-up.
    resolution: null
    lesson: LESSON-20260823-006
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Opened from R2 (estimated 1-2 d). R4 re-assessed cheaper (~1 d, a file drop) and root-caused it to the #include, but also proved it is not the binding constraint."

  - id: ISSUE-20260823-009
    title: "Renode's ESP32_UART model is S3/C3-shaped and wrong for the S2"
    category: bug
    severity: low
    priority: p3
    confidence: high
    scope: emulator-upstream
    observed: |
      The S2 has no CLK_CONF register; 0x74 and 0x78 are UART_DATE and UART_ID, both modelled
      incorrectly. UART_INT_ST (0x08) is enumerated but never implemented (11 of 30 registers),
      confirmed at runtime - so interrupt-driven serial breaks. Polled FIFO writes work.
    expected: "Register map matches the ESP32-S2 TRM."
    trace_link: "docs/findings/R1-renode-capability-audit.md; docs/findings/R3-uart-probe.md"
    status: open
    next_action: "No action needed - polled writes are sufficient for the telemetry path. Revisit only if interrupt-driven serial is ever required."
    resolution: null
    lesson: null
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Found during R1 audit, confirmed at runtime in R3."

