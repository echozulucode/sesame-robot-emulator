  # ---------------------------------------------------------------- RESOLVED

  - id: ISSUE-20260823-014
    title: "`git apply` silent no-op built the wrong firmware config"
    category: bug
    severity: high
    priority: p1
    confidence: high
    scope: build
    observed: |
      The scratch sketch directory sat inside the repo work tree, so git resolved patch paths
      against the repo root, printed "Skipped patch", and EXITED 0. Both the distro-v3-s3 and
      distro-v1-esp32 profiles silently compiled the S2 Mini pin configuration.
    expected: "A patch that does not apply fails the build."
    trace_link: "docs/findings/F3-firmware-build.md; commit 1498c3c"
    status: resolved
    next_action: "None - resolved; see resolution."
    resolution: |
      Throwaway `git init` in the scratch dir. The build driver now asserts the resulting pin
      arrays against hardware-map.json, which is what caught it in the first place.
    lesson: LESSON-20260823-001
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Caught ONLY by the hardware-map pin assertion - exit code and stdout both looked fine. Strongest single argument for machine-checkable cross-artifact assertions."

  - id: ISSUE-20260823-015
    title: "Telemetry routed to USB-CDC instead of UART0"
    category: bug
    severity: high
    priority: p1
    confidence: high
    scope: firmware
    observed: |
      s2mini builds with -DARDUINO_USB_CDC_ON_BOOT=1, so bare `Serial` is USBSerial, not UART0.
      Reproduced at binary level: `l32r a10, (USBSerial)` immediately before the telemetry printf.
      The instrumentation would have compiled, linked and emitted perfectly onto a transport
      nobody was listening to. Two of three profiles were exposed; distro-v1-esp32 was safe only
      because the original ESP32 has no USB peripheral - luck, not design.
    expected: "Telemetry reaches the UART0 socket the bridge consumes."
    trace_link: "docs/findings/R6-R7-telemetry-bridge.md; commit be9e56e"
    status: resolved
    next_action: "None - resolved; see resolution."
    resolution: |
      Emit on `Serial0`, which the core defines unconditionally outside the CDC conditional.
      Chosen over CDCOnBoot=dis_cdc so routing is a property of the instrumentation rather than
      of a board menu anyone can flip. Regression test asserts the routing decision via a
      backward dataflow trace on the built artifact - string presence PASSED on the broken build.
      Cost: flash +356 B -> +10 024 B, because Serial0.begin() links a UART driver a CDC build
      never pulls in.
    lesson: LESSON-20260823-002
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Found by the R4 boot-probe agent reading a build manifest for an unrelated reason - not by the agent that wrote the code."
      - timestamp: 2026-08-23T00:00:00Z
        note: "Fixed. hello banner also moved to just after Serial.begin(), since display.begin() hard-fails into while(1) and anything announced later is never announced."

  - id: ISSUE-20260823-016
    title: "core.autocrlf byte drift hidden by git's stat cache"
    category: bug
    severity: medium
    priority: p2
    confidence: high
    scope: repo
    observed: |
      core.autocrlf=true on this host rewrote LF to CRLF on 6 checked-out files. Worse, git then
      reported the tree CLEAN while 3 files still had wrong bytes on disk - git status, git diff
      and update-index --really-refresh all short-circuit on matching size/mtime.
    expected: "Checked-out bytes match the committed blobs, or git says they do not."
    trace_link: "docs/findings/F2-upstream-drift.md; commit 5c6f1a8"
    status: resolved
    next_action: "None - resolved; see resolution."
    resolution: |
      .gitattributes pins LF repo-wide. Fetch scripts pin core.autocrlf=false, delete and
      re-materialise tracked files, and assert via `git ls-files --eol`. No firmware source was
      affected, but F3's determinism check would have hit the same trap.
    lesson: LESSON-20260823-003
    history:
      - timestamp: 2026-08-23T00:00:00Z
        note: "Found by F2 while diffing the pinned checkout against the vendored copy."

