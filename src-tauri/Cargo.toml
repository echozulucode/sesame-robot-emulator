# The desktop shell — Phase 5 T1.
#
# The only Rust in this repository, and deliberately the smallest thing that can
# host the existing web app in a native window. Everything the app already does
# — the `@SESAME` parser, the behavioural simulator, the 3D scene, the lessons —
# is browser code and stays browser code (see `docs/plans/phase-5-tauri-desktop-app.md` §4,
# option C). Rust's job, when T3 lands, is the two things a webview cannot do:
# spawn `qemu-system-xtensa.exe` and hold a TCP socket to UART0. T1 does neither.

[package]
name = "sesame-robot-emulator"
version = "0.1.0"
description = "Sesame Robot Emulator — the emulator, the virtual robot and the lessons, in a native window"
authors = ["Eric Zimmerman <contact@echozed.com>"]
license = "Apache-2.0"
homepage = "https://echozed.com"
repository = "https://github.com/echozulucode/sesame-robot-emulator"
publish = false
edition = "2021"
rust-version = "1.77.2"

# `staticlib` and `cdylib` are what a mobile entry point links against, and
# `rlib` is what `main.rs` links against. We ship desktop only — the plan says
# so explicitly (§8) — but the split costs nothing and is the difference between
# "mobile was never wanted" and "mobile is now a rewrite".
[lib]
name = "sesame_robot_emulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# T2: build.rs reads `bundle.resources` out of tauri.conf.json and generates the
# runtime manifest from it, so the report can never describe a file the bundler
# was not asked to ship. Already a runtime dependency below; this is the same
# crate, compiled for the host.
serde_json = "1.0"

# `tauri init` also seeded `log` + `tauri-plugin-log`. Both were removed: T1
# does not log anything, and a plugin is a permission surface. Capabilities
# start at `core:default` and grow only when something actually needs them.
[dependencies]
tauri = { version = "2.11.3", features = [] }
# T2: `app.path().resolve(.., Resource)` hands back an extended-length Windows
# path — the "verbatim" form that begins with a backslash-backslash-question
# -mark. It is a correct path and Rust opens it happily, but T3 has to put one
# of these inside `-drive file=<image>` on a QEMU command line and the other
# into `Command::new`, and the prefix is a red herring in every diagnostic
# downstream. `simplified()` strips it only when the result is
# provably equivalent. Already in Cargo.lock as a transitive dependency of
# tauri, so this costs nothing to compile.
dunce = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# T3: the ONLY new dependency, and only on Windows.
#
# `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` is the difference between "no orphaned
# qemu-system-xtensa.exe" as a code path and as a property the kernel enforces.
# A `kill()` — in any form, including `taskkill /T`, which `scripts/dev-lab.mjs`
# uses — only runs if this process is still alive to run it, and the failure
# that matters is the one where it is not. See `src/qemu/job.rs`.
#
# windows-sys is already in Cargo.lock three times over as a transitive
# dependency of tauri, wry and tokio, so this adds a feature set rather than a
# crate. Four features, all of them needed by CreateJobObjectW's own signature.
# No other Rust crate was added by T3: the panic patterns are matched by hand
# rather than by pulling in `regex`, and the blocking work runs on tauri's own
# tokio via `async_runtime::spawn_blocking` rather than on a second runtime.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
